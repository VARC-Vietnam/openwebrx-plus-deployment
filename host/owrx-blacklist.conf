# Blacklist host kernel drivers that claim SDR USB devices.
# Installed to /etc/modprobe.d/owrx-blacklist.conf by install.sh
# A reboot (or unloading modules) is required after install.

# RTL-SDR (Realtek RTL2832U)
blacklist dvb_usb_rtl28xxu
blacklist dvb_usb_rtl2832u
blacklist dvb_usb_v2
blacklist rtl2832
blacklist rtl2830
blacklist rtl8xxxu

# SDRPlay / MSI
blacklist sdr_msi3101
blacklist msi001
blacklist msi2500

# HackRF
blacklist hackrf
